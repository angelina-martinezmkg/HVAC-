<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request received | HVAC Services</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(ellipse at 80% 20%,#e7f0ff 0%,transparent 55%),radial-gradient(ellipse at 10% 90%,#e2faf5 0%,transparent 50%),#f5f8fc;color:#0e1a2b;font-family:Inter,system-ui,sans-serif;text-align:center}
    main{max-width:600px;display:grid;justify-items:center;gap:1.2rem}
    .ico{width:84px;height:84px;border-radius:50%;background:#0e1a2b;display:grid;place-items:center}
    .ico svg{width:48px;height:48px;fill:#3d7bff;animation:spin 4s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{margin:0;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.02;letter-spacing:-.045em}
    h1 span{background:linear-gradient(100deg,#3d7bff,#34d1b6);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{margin:0;color:#5d6b80;font-size:1.1rem;line-height:1.6}
    .row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
    a.btn{display:inline-flex;align-items:center;min-height:3.3rem;padding:0 1.6rem;border-radius:999px;background:#0e1a2b;color:#fff;font-weight:600;text-decoration:none}
    a.btn--line{background:transparent;color:#0e1a2b;box-shadow:inset 0 0 0 1.5px #0e1a2b}
    a:focus-visible{outline:3px solid #3d7bff;outline-offset:3px}
    @media (prefers-reduced-motion:reduce){.ico svg{animation:none}}
  </style>
</head>
<body>
  <main>
    <span class="ico"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 50C46 30 52 10 66 6c10-3 16 8 10 16-6 9-16 14-26 28z"/><path d="M50 50C46 30 52 10 66 6c10-3 16 8 10 16-6 9-16 14-26 28z" transform="rotate(120 50 50)"/><path d="M50 50C46 30 52 10 66 6c10-3 16 8 10 16-6 9-16 14-26 28z" transform="rotate(240 50 50)"/><circle cx="50" cy="50" r="7"/></svg></span>
    <h1>Request <span>received.</span></h1>
    <p>Thanks for reaching out. We'll review your request and get back to you soon to confirm the details.</p>
    <div class="row">
      <a class="btn" href="/">Back to home</a>
      <a class="btn btn--line" href="tel:+10000000000">Call (000) 000-0000</a>
    </div>
  </main>
</body>
</html>
